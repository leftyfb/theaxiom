# Repository-audited package groups; candidates, not a lockfile.
schema_version: 1
targets:
  ubuntu: ["24.04", "26.04"]
  architectures: [amd64, arm64]
  qualification: pending
python:
  manifest: pyproject.toml
  runtime: true
  dev_extra: dev
  ci_tested_python: "3.12"
apt:
  server_runtime: [python3, nginx, systemd, ca-certificates, bash, coreutils, util-linux, curl]
  install: [python3-venv, python3-pip]
  checkout_optional: [git]
  offline_https_optional: [openssl]
  zim_candidate: [kiwix-tools]
  nfs_optional: [nfs-common]
  smb_candidate: [cifs-utils]
  controller: [git, openssh-client, bash, coreutils, util-linux]
  controller_external: [gh]
  target_ssh_optional: [openssh-server]
  asset_preparation_optional: [wget, unzip]
  development: [nodejs]
external_assets:
  pdfjs:
    manifest: docs/pdfjs.md
    version: "6.5.438"
    distribution: legacy-generic
    install_root: /opt/pdfjs/current
  kiwix:
    executable: kiwix-serve
    compatibility_reference_libkiwix: "14.0.0"
    installed_version: unverified
    installed_provenance: unverified
