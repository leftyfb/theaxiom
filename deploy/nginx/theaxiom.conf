# The Axiom standard frontend. Substitute the actual LAN IP and DNS names.
# Install as /etc/nginx/sites-available/theaxiom and enable that site.
# The web root contains only deliberately public static files.
server {
    listen 192.168.0.4:80;
    server_name vancouver 192.168.0.4;
    root /opt/theaxiom/app/deploy/www;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        include /etc/nginx/snippets/theaxiom-backend.conf;
    }
    location = /favicon.svg {
        default_type image/svg+xml;
        try_files $uri =404;
    }
    location = /search { include /etc/nginx/snippets/theaxiom-backend.conf; }
    location = /index.html {
        include /etc/nginx/snippets/theaxiom-backend.conf;
    }

    # No auth_basic here: the application owns the administrator password.
    # Restrict the upstream to an explicit loopback binding.
    location = /admin {
        include /etc/nginx/snippets/theaxiom-backend.conf;
    }
    location = /admin/ {
        include /etc/nginx/snippets/theaxiom-backend.conf;
    }
    location = /admin/sources { include /etc/nginx/snippets/theaxiom-backend.conf; }
    location = /admin/sources/ { include /etc/nginx/snippets/theaxiom-backend.conf; }
    location = /admin/settings { include /etc/nginx/snippets/theaxiom-backend.conf; }
    location = /admin/settings/ { include /etc/nginx/snippets/theaxiom-backend.conf; }
    # Large request bodies are permitted exclusively for the authenticated PDF upload endpoint.
    location = /api/pdf-upload {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16m;
        client_body_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
    location ^~ /api/ {
        include /etc/nginx/snippets/theaxiom-backend.conf;
    }
    location = /health {
        include /etc/nginx/snippets/theaxiom-backend.conf;
    }

    # All Wikipedia requests, including deep links, require publication.
    location = /_publication_wikipedia {
        internal;
        proxy_pass http://127.0.0.1:8080/internal/publication/wikipedia-en;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_cache off;
    }
    location = /read/wikipedia-en {
        include /etc/nginx/snippets/theaxiom-backend.conf;
    }
    # Native viewer library button returns to the application homepage.
    # An internal upstream health probe still sees the actual Kiwix catalog.
    location = /wikipedia { return 302 /; }
    location = /wikipedia/ { return 302 /; }
    # Customize only the libkiwix 14.0.0 viewer shell. Exact anchor match
    # deliberately falls back to the native root redirect on upstream changes.
    location = /wikipedia/viewer {
        auth_request /_publication_wikipedia;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        sub_filter_once on;
        sub_filter '<a id="kiwix_serve_taskbar_library_button"
               title="Go to welcome page"
               accesskey="w"
               aria-label="Go to welcome page"
               href="./">
              <button>&#x1f3e0;</button>
            </a>' '<a id="kiwix_serve_taskbar_library_button" href="/" accesskey="w" aria-labelledby="library-return-label" style="text-decoration:none;vertical-align:middle"><span id="library-return-label" title="Back to library" style="display:inline-block;box-sizing:border-box;min-height:30px;line-height:24px;padding:2px 8px;margin-right:5px;border:1px solid #176b4d;border-radius:5px;background:#18362d;color:#fff;font:600 14px/24px system-ui,sans-serif;white-space:nowrap">← Back to library</span></a>';
    }
    location ^~ /wikipedia/ {
        auth_request /_publication_wikipedia;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
    # Other content routes are not exposed.
    location / {
        return 404;
    }
}
