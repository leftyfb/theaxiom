# The Axiom public frontend: all IPv4 and IPv6 interfaces, including Tailscale.
# Install as /etc/nginx/sites-available/theaxiom and enable that site.
# The web root contains only deliberately public static files.
log_format axiom_source_timing '$time_iso8601 $request_method $status '
                               'request=$request_time upstream_connect=$upstream_connect_time '
                               'upstream_header=$upstream_header_time upstream=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /opt/theaxiom/app/deploy/www;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
    }
    # Public brand assets also load while the admin HTTP auth challenge is shown.
    location = /favicon.svg {
        default_type image/svg+xml;
        try_files $uri =404;
        # Inherit site-wide nosniff and no-referrer security headers.
    }
    location = /favicon.png {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
    }
    location = /favicon.ico {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
    }
    location = /search { include /opt/theaxiom/app/templates/theaxiom-backend.conf; }
    location = /index.html {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
    }

    # No auth_basic here: the application owns the administrator password.
    # Restrict the upstream to an explicit loopback binding.
    location = /admin {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
    }
    location = /admin/ {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
    }
    location = /admin/login { include /opt/theaxiom/app/templates/theaxiom-backend.conf; }
    location = /admin/sources { include /opt/theaxiom/app/templates/theaxiom-backend.conf; }
    location = /admin/sources/ { include /opt/theaxiom/app/templates/theaxiom-backend.conf; }
    location = /admin/groupings { include /opt/theaxiom/app/templates/theaxiom-backend.conf; }
    location = /admin/groupings/ { include /opt/theaxiom/app/templates/theaxiom-backend.conf; }
    location = /admin/settings { include /opt/theaxiom/app/templates/theaxiom-backend.conf; }
    location = /admin/settings/ { include /opt/theaxiom/app/templates/theaxiom-backend.conf; }
    # Large request bodies are permitted exclusively for the authenticated PDF upload endpoint.
    location = /api/pdf-upload {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "theaxiom_session=$cookie_theaxiom_session";
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16m;
        client_body_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
    location = /api/sources {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
        access_log /var/log/nginx/theaxiom-sources-timing.log axiom_source_timing;
    }
    location = /api/sources/ {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
        access_log /var/log/nginx/theaxiom-sources-timing.log axiom_source_timing;
    }
    location ^~ /api/ {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
    }
    location = /health {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
    }

    # Generic Kiwix reader. The entire prefix is gated by a dynamic
    # publication check; the upstream is never directly LAN-accessible.
    # The backend additionally verifies the exact published book ID for
    # /zim/content/<id>/... so stale archives cannot remain accessible.
    location ~ "^/read/zim/[a-z0-9-]{1,63}$" {
        include /opt/theaxiom/app/templates/theaxiom-backend.conf;
    }
    location = /_publication_zim {
        internal;
        proxy_pass http://127.0.0.1:8080/internal/publication/zim;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Axiom-Original-URI $request_uri;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_cache off;
    }
    location = /zim { return 302 /; }
    # Shared Kiwix viewer shell: every ZIM (Wikipedia, Ready.gov, future
    # sources) gets the same direct return to The Axiom homepage.
    # Attach navigation only to the viewer shell.
    location = /zim/axiom-navigation.js {
        default_type text/javascript;
        alias /opt/theaxiom/app/templates/kiwix-navigation.js;
    }
    location = /zim/viewer {
        auth_request /_publication_zim;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        sub_filter_once on;
        sub_filter '</body>' '<script src="/zim/axiom-navigation.js"></script></body>';
        sub_filter '<a id="kiwix_serve_taskbar_library_button"
               title="Go to welcome page"
               accesskey="w"
               aria-label="Go to welcome page"
               href="./">
              <button>&#x1f3e0;</button>
            </a>' '<a id="kiwix_serve_taskbar_library_button" href="/" accesskey="w" aria-labelledby="library-return-label" style="text-decoration:none;vertical-align:middle"><span id="library-return-label" title="Back to library" style="display:inline-block;box-sizing:border-box;min-height:30px;line-height:24px;padding:2px 8px;margin-right:5px;border:1px solid #176b4d;border-radius:5px;background:#18362d;color:#fff;font:600 14px/24px system-ui,sans-serif;white-space:nowrap">← Back to library</span></a>';
    }
    location ^~ /zim/ {
        auth_request /_publication_zim;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Other content routes are not exposed.
    location / {
        return 404;
    }
}
