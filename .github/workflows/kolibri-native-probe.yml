name: Native Kolibri proof of concept (#34)
on:
  push:
    branches: [main, kolibri-native-34]
    paths:
      - 'deploy/kolibri/**'
      - 'src/theaxiom/kolibri*.py'
      - 'scripts/probe_kolibri_native.py'
      - 'tests/test_kolibri*.py'
      - '.github/workflows/kolibri-native-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, axiom-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Isolated native runtime
        run: |
          venv=$(mktemp -d "$RUNNER_TEMP/kolibri-native-XXXXXX")
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"
          echo "KOLIBRI_PROBE_VENV=$venv" >> "$GITHUB_ENV"
      - name: Install pinned native package and browser
        run: |
          python -m pip install -e '.[dev]' 'kolibri==0.19.5' 'playwright>=1.50,<2'
          python -m playwright install chromium
      - name: Native package regression tests
        run: python -m pytest -q tests/test_kolibri_scope.py tests/test_kolibri_native.py tests/test_kolibri_search.py tests/test_kolibri_publication.py tests/test_kolibri_jobs.py tests/test_kolibri_admin.py
      - name: Verify native scoped import and offline browser
        run: python scripts/probe_kolibri_native.py
      - name: Remove isolated runtime
        if: always()
        run: |
          if [ -n "$KOLIBRI_PROBE_VENV" ] && [ -d "$KOLIBRI_PROBE_VENV" ]; then
            rm -rf -- "$KOLIBRI_PROBE_VENV"
          fi
