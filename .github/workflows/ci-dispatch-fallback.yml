name: Ensure CI runs for main

# GitHub API-mediated commits may not generate a usable push-triggered run.
# This small fallback checks whether Application CI has already been scheduled
# for the current main SHA before dispatching it. No deployment occurs here.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-if-missing:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch Application CI only for an untested main SHA
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const sha = branch.data.commit.sha;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 100
            });
            const existing = runs.data.workflow_runs.find(run =>
              run.head_sha === sha &&
              ['push', 'workflow_dispatch', 'schedule'].includes(run.event)
            );
            if (existing) {
              core.info('Application CI already exists for ' + sha +
                        ': run ' + existing.id + ' (' + existing.status + ')');
              return;
            }
            // Explicit workflow_dispatch also works when a push-triggered
            // event has been suppressed by the API writer's token.
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'ci.yml', ref: 'main'
            });
            core.info('Dispatched Application CI for ' + sha);
