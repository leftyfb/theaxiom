name: Telegram issue completion notifications

on:
  issues:
    types: [closed]

permissions: {}

jobs:
  notify:
    if: ${{ !github.event.issue.pull_request && github.event.issue.state_reason == 'completed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send completed issue to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              sys.exit("Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets")
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)
          issue = event["issue"]
          message = (
              f"✅ The Axiom issue completed\n"
              f"#{issue['number']} — {issue['title']}\n"
              f"{issue['html_url']}"
          )
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps({
                  "chat_id": chat_id,
                  "text": message[:4096],
                  "link_preview_options": {"is_disabled": True},
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  sys.exit("Telegram rejected the message")
          except urllib.error.HTTPError as exc:
              sys.exit(f"Telegram returned HTTP {exc.code}")
          print("Telegram accepted completion notification")
          PY
