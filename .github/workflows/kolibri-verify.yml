name: One-time Kolibri integration verification (#34)
on:
  push:
    branches: [kolibri-static-reader-34]
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, axiom-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/kolibri-verify-venv"
          echo "$RUNNER_TEMP/kolibri-verify-venv/bin" >> "$GITHUB_PATH"
      - name: Install test and browser dependencies
        run: |
          python -m pip install -e '.[dev]' 'playwright>=1.50,<2'
          python -m playwright install chromium
      - name: Targeted regression tests
        run: python -m pytest -q tests/test_zim_source.py tests/test_kolibri_scope.py tests/test_kolibri_bundle.py tests/test_catalog_store.py tests/test_admin_page_template.py tests/test_kiwix_update_discovery.py
      - name: Verify bounded official media and offline playback
        run: python scripts/probe_kolibri_live.py
