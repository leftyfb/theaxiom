name: Application CI
on:
  push:
    branches: [main, kolibri-native-34]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Keep only the newest push per branch; PRs have separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    # Never run untrusted pull requests on the persistent tux runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","axiom-ci"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # GitHub's Python 3.12 builds require a newer CPU ISA than tux provides.
      - uses: actions/setup-python@v7
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          python-version: '3.12'
      - name: Use system Python on tux
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/axiom-venv"
          echo "$RUNNER_TEMP/axiom-venv/bin" >> "$GITHUB_PATH"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run application tests
        run: |
          set -o pipefail
          python -m pytest -q --durations=15 --junitxml="$RUNNER_TEMP/axiom-junit.xml" | tee "$RUNNER_TEMP/axiom-pytest.log"
      - name: Install Chromium browser regression dependencies
        run: |
          python -m pip install 'playwright>=1.50,<2'
          if [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi
      - name: Install isolated Kiwix smoke dependencies (GitHub-hosted only)
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kiwix-tools zim-tools nginx
      - name: Run real ZIM serving smoke test
        run: python tests/ci_test_kiwix_live.py
      - name: Validate actual nginx site grammar in an isolated CI configuration
        run: python tests/ci_test_nginx_syntax.py
      - name: Verify real Nginx publication gate in isolated CI
        run: python tests/ci_test_nginx_auth.py
      - name: Run real Chromium desktop and mobile usability journeys
        env:
          AXIOM_BROWSER_ARTIFACTS: ${{ runner.temp }}/axiom-browser
          AXIOM_PROFILE_BROWSER: '1'
        run: python tests/ci_test_browser.py
      - name: Install pinned offline PDF.js renderer for reader fixtures
        run: npm install --no-save --prefix "$RUNNER_TEMP/pdfjs" pdfjs-dist@6.5.438
      - name: Run real PDF and EPUB Chromium reader regression
        env:
          AXIOM_BROWSER_ARTIFACTS: ${{ runner.temp }}/axiom-browser
          AXIOM_PROFILE_BROWSER: '1'
          AXIOM_TEST_PDFJS_ROOT: ${{ runner.temp }}/pdfjs/node_modules/pdfjs-dist
        run: python tests/ci_test_readers_browser.py
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-regression-failures
          path: ${{ runner.temp }}/axiom-browser/
          if-no-files-found: ignore
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output
          path: |
            ${{ runner.temp }}/axiom-pytest.log
            ${{ runner.temp }}/axiom-junit.xml
          if-no-files-found: ignore

  report:
    needs: tests
    if: ${{ always() && github.repository == 'leftyfb/theaxiom' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Linux, X64, axiom-ci]
    timeout-minutes: 5
    steps:
      - name: Retrieve test output
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pytest-output
          path: ${{ runner.temp }}/ci-report
      - name: Report CI result to coordination mailbox
        env:
          GH_TOKEN: ${{ secrets.AC_REPORT_TOKEN }}
          TEST_RESULT: ${{ needs.tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::AC_REPORT_TOKEN is missing"; exit 1; }
          repo=leftyfb/agent-coordination
          title="[CI] The Axiom — ${GITHUB_SHA:0:12} — run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT
          {
            printf 'Repository: %s\nCommit: %s\nBranch: %s\nResult: %s\nRun ID: %s\nAttempt: %s\nWorkflow: %s/%s/actions/runs/%s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$TEST_RESULT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '\nTest output (last 30 lines):\n\n'
            if [[ -f "$RUNNER_TEMP/ci-report/axiom-pytest.log" ]]; then
              tail -n 30 "$RUNNER_TEMP/ci-report/axiom-pytest.log" | tail -c 12000 | sed 's/^/    /'
              printf '\nExcerpt limited to 12000 bytes; see workflow artifact for full output.\n'
            else
              printf 'Test log unavailable; inspect workflow run.\n'
            fi
            printf '\nCI report only; not a poller execution request.\n'
          } > "$report"
          existing="$(gh api --method GET "repos/$repo/issues" -f state=all -f per_page=100 --paginate --jq '.[] | select(.pull_request == null) | [.number,.title] | @tsv' | awk -F '\t' -v title="$title" '$2 == title {print $1}')"
          if [[ -n "$existing" ]]; then
            echo "Report already exists: $existing"
          else
            gh issue create --repo "$repo" --title "$title" --body-file "$report" --label ac:review
          fi
