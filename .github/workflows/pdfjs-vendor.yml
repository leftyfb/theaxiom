name: Prepare pinned PDF.js distribution
on:
  push:
    branches: [main]
    paths:
      - scripts/vendor_pdfjs.py
      - .github/workflows/pdfjs-vendor.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify official archive and extract
        run: python3 scripts/vendor_pdfjs.py "${RUNNER_TEMP}/pdfjs"
      - uses: actions/upload-artifact@v4
        with:
          name: pdfjs-6.5.438-verified
          path: ${{ runner.temp }}/pdfjs/
          retention-days: 7
